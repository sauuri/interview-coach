<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 면접 질문 생성기</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --accent: #f59e0b; --accent2: #fbbf24; --bg: #06080f; --card: #0c1018; --border: #1a2436; --text: #c8d8f0; --muted: #4a6080; }

    body { background: var(--bg); font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; color: var(--text); min-height: 100vh; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(ellipse at 15% 25%, #f59e0b1a 0%, transparent 45%),
        radial-gradient(ellipse at 85% 75%, #fb923c12 0%, transparent 45%);
    }
    body::after {
      content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image: radial-gradient(circle, #1e2a3a 1px, transparent 1px);
      background-size: 32px 32px; opacity: 0.3;
    }

    .wrap { position: relative; z-index: 1; max-width: 820px; margin: 0 auto; padding: 0 20px 80px; }

    .hero { text-align: center; padding: 70px 0 44px; }
    .hero-icon { width: 72px; height: 72px; border-radius: 20px; margin: 0 auto 24px; background: linear-gradient(135deg, #f59e0b, #fbbf24); display: flex; align-items: center; justify-content: center; font-size: 32px; box-shadow: 0 0 40px #f59e0b40; }
    .hero-badge { display: inline-flex; align-items: center; gap: 6px; background: var(--card); border: 1px solid var(--border); border-radius: 50px; padding: 5px 16px; font-size: 12px; color: var(--muted); margin-bottom: 18px; }
    .hero-badge span { color: var(--accent); font-weight: 700; }
    .hero h1 { font-size: clamp(28px, 5vw, 44px); font-weight: 900; letter-spacing: -1px; margin-bottom: 12px; }
    .hero h1 em { font-style: normal; background: linear-gradient(135deg, #f59e0b, #fbbf24, #fde68a); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .hero p { font-size: 15px; color: var(--muted); line-height: 1.7; }

    .form-card { background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 36px; margin-bottom: 20px; position: relative; overflow: hidden; }
    .form-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, #f59e0b, transparent); }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
    @media (max-width: 540px) { .form-row { grid-template-columns: 1fr; } }
    .form-group { margin-bottom: 20px; }
    label { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--accent); margin-bottom: 8px; letter-spacing: 0.8px; text-transform: uppercase; }
    .optional { font-weight: 400; color: var(--muted); font-size: 11px; text-transform: none; letter-spacing: 0; }
    input[type=text], textarea { width: 100%; background: #08101a; border: 1.5px solid var(--border); border-radius: 14px; padding: 13px 16px; color: var(--text); font-size: 14px; font-family: inherit; transition: all 0.2s; }
    input[type=text]:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px #f59e0b12; }
    textarea { min-height: 130px; resize: vertical; line-height: 1.75; }

    .btn { width: 100%; padding: 17px; background: linear-gradient(135deg, #f59e0b, #fbbf24); border: none; border-radius: 16px; color: #080c14; font-size: 16px; font-weight: 800; cursor: pointer; transition: all 0.25s; box-shadow: 0 4px 24px #f59e0b30; }
    .btn:hover { transform: translateY(-3px); box-shadow: 0 8px 32px #f59e0b45; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: none; }

    .loading { display: none; padding: 48px 0; text-align: center; }
    .loading.show { display: block; }
    .loading-ring { width: 52px; height: 52px; margin: 0 auto 20px; position: relative; }
    .loading-ring::before, .loading-ring::after { content: ''; position: absolute; inset: 0; border-radius: 50%; border: 3px solid transparent; }
    .loading-ring::before { border-top-color: #f59e0b; animation: spin 1s linear infinite; }
    .loading-ring::after { border-bottom-color: #fbbf24; animation: spin 1.5s linear infinite reverse; inset: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: var(--muted); font-size: 14px; }
    .loading-steps { display: flex; gap: 8px; justify-content: center; margin-top: 16px; }
    .loading-steps span { width: 6px; height: 6px; border-radius: 50%; background: var(--border); animation: pulse 1.2s ease-in-out infinite; }
    .loading-steps span:nth-child(2) { animation-delay: 0.2s; }
    .loading-steps span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse { 0%, 100% { background: var(--border); transform: scale(1); } 50% { background: #f59e0b; transform: scale(1.4); } }

    .result { display: none; animation: fadeUp 0.4s ease; }
    .result.show { display: block; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

    .result-header { background: var(--card); border: 1px solid #f59e0b25; border-radius: 20px; padding: 24px 28px; margin-bottom: 16px; display: flex; align-items: center; gap: 18px; position: relative; overflow: hidden; }
    .result-header::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, #f59e0b, transparent); }
    .result-header-icon { width: 52px; height: 52px; border-radius: 14px; background: linear-gradient(135deg, #f59e0b22, #fbbf2415); border: 1px solid #f59e0b33; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
    .result-header-text h2 { font-size: 18px; font-weight: 800; color: #e8f0ff; margin-bottom: 4px; }
    .result-header-text p { font-size: 13px; color: var(--muted); }

    .q-list { display: flex; flex-direction: column; gap: 12px; }
    .q-card { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 22px 24px; transition: all 0.2s; cursor: pointer; }
    .q-card:hover { border-color: #f59e0b33; box-shadow: 0 4px 20px #f59e0b0a; transform: translateY(-1px); }
    .q-top { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 14px; }
    .q-num { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, #f59e0b20, #fbbf2415); border: 1px solid #f59e0b35; color: var(--accent); font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }
    .q-text { font-size: 15px; font-weight: 700; color: #e8f0ff; line-height: 1.55; flex: 1; }
    .q-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .q-category { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 11px; border-radius: 50px; }
    .cat-직무역량 { background: #6366f118; color: #818cf8; border: 1px solid #6366f128; }
    .cat-인성 { background: #10b98118; color: #34d399; border: 1px solid #10b98128; }
    .cat-상황판단 { background: #f59e0b18; color: #fbbf24; border: 1px solid #f59e0b28; }
    .cat-자소서기반 { background: #f43f5e18; color: #fb7185; border: 1px solid #f43f5e28; }
    .cat-회사이해 { background: #06b6d418; color: #22d3ee; border: 1px solid #06b6d428; }
    .q-tip { font-size: 13px; color: var(--muted); line-height: 1.65; padding: 12px 14px; background: #06090f; border-radius: 10px; border-left: 2px solid #f59e0b33; }

    .retry-btn { display: block; width: 100%; padding: 15px; margin-top: 14px; background: transparent; border: 1.5px solid var(--border); border-radius: 14px; color: var(--muted); font-size: 14px; cursor: pointer; transition: all 0.2s; }
    .retry-btn:hover { border-color: var(--accent); color: var(--accent); background: #f59e0b08; }

    .error { background: #120810; border: 1px solid #f43f5e35; border-radius: 14px; padding: 14px 18px; color: #f87171; font-size: 14px; display: none; margin-bottom: 16px; }
    .error.show { display: block; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="hero-icon">🎯</div>
    <div class="hero-badge">✦ <span>GPT-4o-mini</span> 기반 생성</div>
    <h1>AI <em>면접 질문 생성기</em></h1>
    <p>직무와 회사를 입력하면 카테고리별<br>예상 면접 질문 10개 + 답변 팁을 뽑아줘요</p>
  </div>

  <div class="form-card">
    <div class="form-row">
      <div class="form-group" style="margin-bottom:0">
        <label>지원 직무</label>
        <input type="text" id="position" placeholder="예: AI 연구원, 백엔드 개발자">
      </div>
      <div class="form-group" style="margin-bottom:0">
        <label>회사명</label>
        <input type="text" id="company" placeholder="예: 네이버, 카카오, 삼성전자">
      </div>
    </div>
    <div class="form-group" style="margin-top:20px; margin-bottom:0">
      <label>자소서 <span class="optional">(선택 · 넣으면 더 맞춤화된 질문 생성)</span></label>
      <textarea id="cover-letter" placeholder="자소서 내용을 붙여넣으면 자소서 기반 질문도 생성됩니다..."></textarea>
    </div>
    <button class="btn" id="generate-btn" onclick="generate()" style="margin-top:24px">질문 생성하기 →</button>
  </div>

  <div class="error" id="error"></div>

  <div class="loading" id="loading">
    <div class="loading-ring"></div>
    <div class="loading-text">면접관 AI가 질문을 준비하는 중...</div>
    <div class="loading-steps"><span></span><span></span><span></span></div>
  </div>

  <div class="result" id="result">
    <div class="result-header">
      <div class="result-header-icon">🎯</div>
      <div class="result-header-text">
        <h2 id="r-title">예상 면접 질문</h2>
        <p id="r-subtitle"></p>
      </div>
    </div>
    <div class="q-list" id="q-list"></div>
    <button class="retry-btn" onclick="retry()">🔄 다시 생성하기</button>
  </div>
</div>

<script>
  async function generate() {
    const position = document.getElementById('position').value.trim();
    const company = document.getElementById('company').value.trim();
    const coverLetter = document.getElementById('cover-letter').value.trim();
    const err = document.getElementById('error');
    err.classList.remove('show');

    if (!position) { showError('지원 직무를 입력해주세요.'); return; }
    if (!company) { showError('회사명을 입력해주세요.'); return; }

    document.getElementById('generate-btn').disabled = true;
    document.getElementById('loading').classList.add('show');
    document.getElementById('result').classList.remove('show');

    try {
      const res = await fetch('/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ position, company, cover_letter: coverLetter })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || '생성 중 오류가 발생했습니다.');
      showResult(data, position, company);
    } catch (e) {
      showError(e.message);
    } finally {
      document.getElementById('generate-btn').disabled = false;
      document.getElementById('loading').classList.remove('show');
    }
  }

  function showResult(data, position, company) {
    document.getElementById('r-title').textContent = `${company} · ${position} 예상 질문`;
    document.getElementById('r-subtitle').textContent = `총 ${(data.questions || []).length}개 질문 · 답변 팁 포함`;
    document.getElementById('q-list').innerHTML = (data.questions || []).map((q, i) => `
      <div class="q-card">
        <div class="q-top">
          <div class="q-num">${i + 1}</div>
          <div class="q-text">${q.question}</div>
        </div>
        <div class="q-meta">
          <span class="q-category cat-${q.category}">${q.category}</span>
        </div>
        <div class="q-tip">💡 ${q.tip}</div>
      </div>
    `).join('');
    document.getElementById('result').classList.add('show');
  }

  function showError(msg) {
    const err = document.getElementById('error');
    err.textContent = msg;
    err.classList.add('show');
  }

  function retry() {
    document.getElementById('result').classList.remove('show');
    document.getElementById('position').value = '';
    document.getElementById('company').value = '';
    document.getElementById('cover-letter').value = '';
    document.getElementById('error').classList.remove('show');
  }
</script>
</body>
</html>
